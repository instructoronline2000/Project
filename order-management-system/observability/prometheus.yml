global:
  scrape_interval: 10s

# host.docker.internal resolves to the host machine, so this works whether
# order-service runs in Docker Compose or directly from your IDE/Maven.
scrape_configs:
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8083"]

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
